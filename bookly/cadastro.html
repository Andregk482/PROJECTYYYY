<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookly — Criar conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/css/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ELEMENTOS 3D -->
    <div class="float-3d float-cube"></div>
    <div class="float-3d float-orb"></div>
    <div class="float-3d float-ring"></div>
    <div class="float-3d float-diamond"></div>
    <div class="float-3d float-sparkle"></div>
    <div class="float-3d float-sparkle-2"></div>

    <!-- NAVBAR -->
    <nav class="navbar" id="navbar"></nav>
    <div class="menu-overlay" onclick="closeMobileMenu()"></div>
    <aside class="mobile-menu" id="mobile-menu"></aside>

    <!-- AUTH -->
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    </svg>
                </div>
                <span>Bookly</span>
            </a>

            <h1>Criar sua conta</h1>
            <p class="auth-subtitle">Compre e venda livros em um só lugar</p>

            <form id="signup-form" onsubmit="return handleSignup(event)">
                <div class="field-group">
                    <label class="field-label">Nome completo</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" id="name" placeholder="Seu nome" required autocomplete="name">
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">E-mail</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">Senha</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required
                            autocomplete="new-password" oninput="checkStrength(this.value)">
                        <svg class="password-toggle" id="toggle-pwd" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" onclick="togglePassword()">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-label" id="strength-label"></span>
                    </div>
                </div>

                <div class="auth-info">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--azul)" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="16" x2="12" y2="12" />
                        <line x1="12" y1="8" x2="12.01" y2="8" />
                    </svg>
                    Você pode comprar e vender livros com a mesma conta.
                </div>

                <div class="auth-error" id="error-msg">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span id="error-text"></span>
                </div>

                <button type="submit" class="btn btn-fill btn-block">Criar conta</button>
            </form>

            <div class="auth-divider"><span>ou</span></div>

            <div class="auth-footer">
                Já tem conta? <a href="login.html">Entrar</a>
            </div>
        </div>
    </div>
    <script src="/js/cadastro.js"></script>
</body>

</html>
