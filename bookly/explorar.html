<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookly — Explorar livros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/css/explorar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar" id="navbar"></nav>
    <div class="menu-overlay" onclick="closeMobileMenu()"></div>
    <aside class="mobile-menu" id="mobile-menu"></aside>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content">
            <button class="sidebar-toggle" onclick="toggleMobileSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="20" y2="6" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="4" y1="18" x2="20" y2="18" />
                </svg>
                Filtros
            </button>
            <div class="content-header">
                <div>
                    <h2 id="page-title">Explorar livros</h2>
                    <p id="page-subtitle">Encontre sua próxima leitura</p>
                    <div class="results-count" id="results-count"></div>
                </div>
                <div class="sort-area">
                    <span class="sort-label">Ordenar:</span>
                    <select class="sort-select" id="sort-select" onchange="renderBooks()">
                        <option value="recent">Mais recentes</option>
                        <option value="low">Menor preço</option>
                        <option value="high">Maior preço</option>
                        <option value="rating">Melhor avaliados</option>
                    </select>
                </div>
            </div>
            <div class="book-grid" id="book-grid"></div>
        </main>
    </div>
    <script src="/js/explorar.js"></script>
</body>

</html>
